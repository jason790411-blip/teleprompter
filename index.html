<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="提詞錄影">
<meta name="theme-color" content="#0b0d10">
<title>提詞錄影機</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: rgba(18, 21, 26, 0.92);
    --fg: #f4f6f8;
    --muted: #9aa3ad;
    --accent: #ffcc33;
    --rec: #ff3b30;
    --line: rgba(255,255,255,0.14);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Camera */
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cam.mirror { transform: scaleX(-1); }
  #camMsg { position: fixed; inset: 0; display: grid; place-items: center; padding: calc(var(--ph, 42%) * 0 + 45vh) 32px 140px; text-align: center;
    color: var(--muted); line-height: 1.7; }
  #camMsg button { margin-top: 16px; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: #111; font-weight: 700; }

  /* Prompter: top of screen, close to the front lens */
  #prompter { position: fixed; left: 0; right: 0; top: 0;
    height: var(--ph, 42%);
    padding: calc(var(--safe-t) + 14px) max(18px, var(--safe-r)) 0 max(18px, var(--safe-l));
    background: linear-gradient(to bottom, rgba(0,0,0,var(--dim,.62)) 0%, rgba(0,0,0,var(--dim,.62)) 78%, rgba(0,0,0,0) 100%);
    z-index: 5; }
  #scroller { height: 100%; overflow-y: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 80%, transparent 100%); }
  #scroller::-webkit-scrollbar { display: none; }
  #text { white-space: pre-wrap; word-break: break-word; font-weight: 600;
    font-size: var(--fs, 30px); line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,.6);
    padding-top: 18%; padding-bottom: 70vh; text-align: var(--align, left); }
  #text.flip { transform: scaleX(-1); }
  #readLine { position: absolute; left: 6px; top: calc(var(--safe-t) + 14px + 18%); width: 6px; height: 1.5em;
    font-size: var(--fs, 30px); border-radius: 3px; background: var(--accent); opacity: .85; pointer-events: none; }
  #pausedTag { position: absolute; right: max(14px, var(--safe-r)); bottom: 8px; font-size: 12px; letter-spacing: .08em;
    padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.6); color: var(--accent); pointer-events: none; }

  /* Top-right status */
  #recTime { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--safe-b) + 128px); padding: 5px 12px; border-radius: 8px; background: var(--rec);
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }

  /* Bottom controls */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 14px max(16px, var(--safe-r)) calc(var(--safe-b) + 18px) max(16px, var(--safe-l));
    background: linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0));
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .side { display: flex; gap: 10px; align-items: center; }
  .side.right { justify-content: flex-end; }
  .round { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.45); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .round svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .round:active { background: rgba(255,255,255,.15); }
  #speedBox { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.45); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px; }
  #speedBox button { width: 38px; height: 38px; border-radius: 50%; font-size: 22px; line-height: 1; }
  #speedBox button:active { background: rgba(255,255,255,.15); }
  #speedVal { min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
  #recBtn { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
  #recBtn i { display: block; width: 60px; height: 60px; border-radius: 50%; background: var(--rec); transition: all .2s; }
  #recBtn.on i { width: 30px; height: 30px; border-radius: 7px; }
  #recBtn:disabled { opacity: .4; }

  /* Countdown */
  #count { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; font-size: 140px; font-weight: 800;
    color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.6); pointer-events: none; }

  /* Sheets */
  .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
  .sheet .card { width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; background: var(--panel);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 20px 20px 0 0; border: 1px solid var(--line); border-bottom: 0;
    padding: 18px max(18px, var(--safe-r)) calc(var(--safe-b) + 20px) max(18px, var(--safe-l));
    display: flex; flex-direction: column; gap: 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .head h2 { margin: 0; font-size: 18px; }
  .done { padding: 8px 18px; border-radius: 999px; background: var(--accent); color: #111; font-weight: 700; }
  textarea { width: 100%; min-height: 32vh; resize: vertical; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(0,0,0,.35); color: var(--fg); padding: 12px; font: inherit; font-size: 16px; line-height: 1.6; }
  .row { display: grid; grid-template-columns: 6.5em 1fr 3.4em; align-items: center; gap: 10px; font-size: 15px; }
  .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .group-label { font-size: 12px; letter-spacing: .1em; color: var(--muted); margin-bottom: -6px; }

  #result video { width: 100%; max-height: 46vh; border-radius: 12px; background: #000; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions button, .actions a { padding: 14px; border-radius: 12px; text-align: center; font-weight: 700; text-decoration: none; }
  .primary { background: var(--accent); color: #111; }
  .ghost { border: 1px solid var(--line); color: var(--fg); }
  #toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 50%); transform: translate(-50%,-50%); z-index: 40;
    background: rgba(0,0,0,.8); padding: 10px 16px; border-radius: 10px; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { #recBtn i { transition: none; } }
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<div id="camMsg" hidden></div>

<div id="prompter">
  <div id="scroller"><div id="text"></div></div>
  <div id="readLine"></div>
  <div id="pausedTag" hidden>已暫停・點一下繼續</div>
</div>

<div id="recTime" hidden>00:00</div>

<div id="bar">
  <div class="side">
    <button class="round" id="editBtn" aria-label="編輯講稿與設定">
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>
    </button>
    <button class="round" id="flipBtn" aria-label="切換前後鏡頭">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13.5a2.5 2.5 0 0 0 4.6 1.4M14.5 12.5a2.5 2.5 0 0 0-4.6-1.4"/></svg>
    </button>
  </div>
  <button id="recBtn" aria-label="開始錄影"><i></i></button>
  <div class="side right">
    <div id="speedBox" aria-label="捲動速度">
      <button id="slower" aria-label="減速">−</button>
      <span id="speedVal">5</span>
      <button id="faster" aria-label="加速">+</button>
    </div>
  </div>
</div>

<div id="count" hidden></div>

<!-- Settings sheet -->
<div class="sheet" id="settings" hidden>
  <div class="card">
    <div class="head"><h2>講稿與設定</h2><button class="done" id="settingsDone">完成</button></div>
    <textarea id="script" placeholder="把講稿貼在這裡"></textarea>
    <div class="group-label">字幕</div>
    <div class="row"><label for="fs">字體大小</label><input type="range" id="fs" min="18" max="64" step="1"><output id="fsOut"></output></div>
    <div class="row"><label for="speed">捲動速度</label><input type="range" id="speed" min="1" max="15" step="1"><output id="speedOut"></output></div>
    <div class="row"><label for="ph">字幕區高度</label><input type="range" id="ph" min="25" max="80" step="1"><output id="phOut"></output></div>
    <div class="row"><label for="dim">背景深淺</label><input type="range" id="dim" min="0" max="90" step="5"><output id="dimOut"></output></div>
    <div class="toggles">
      <button class="chip" id="tCenter" aria-pressed="false">文字置中</button>
      <button class="chip" id="tFlipText" aria-pressed="false">文字左右翻轉（提詞玻璃用）</button>
      <button class="chip" id="tCountdown" aria-pressed="true">錄影前倒數 3 秒</button>
    </div>
    <div class="group-label">錄影</div>
    <div class="toggles">
      <button class="chip" id="tMirror" aria-pressed="true">預覽畫面鏡像</button>
      <button class="chip" id="tHD" aria-pressed="true">高畫質 1080p</button>
    </div>
    <p class="hint">
      點字幕可以暫停或繼續，用手指上下滑可以調整位置。<br>
      藍牙遙控器或鍵盤：空白鍵／Enter 暫停或繼續，↑↓ 加減速，←→ 倒回或往前一點，R 開始或停止錄影。<br>
      字幕只會顯示在螢幕上，不會錄進影片裡。講稿只存在這支手機的瀏覽器裡。
    </p>
  </div>
</div>

<!-- Result sheet -->
<div class="sheet" id="result" hidden>
  <div class="card">
    <div class="head"><h2>錄好了</h2><span id="resultInfo" class="hint"></span></div>
    <video id="playback" playsinline controls></video>
    <div class="actions">
      <button class="primary" id="saveBtn">儲存影片</button>
      <button class="ghost" id="discardBtn">刪除重錄</button>
    </div>
    <p class="hint" id="saveHint">iPhone：按「儲存影片」後選「儲存影片」就會存到照片 App。</p>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const cam = $('cam'), scroller = $('scroller'), textEl = $('text');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tp_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tp_' + k, JSON.stringify(v)); } catch {} }
  };

  const SAMPLE = '大家好，歡迎回到我的頻道。\n\n今天要跟大家分享一個很實用的小技巧：怎麼用手機一邊錄影、一邊看講稿。\n\n按下面的鉛筆圖示，就可以把這段範例換成你自己的講稿。\n\n錄影的時候，字幕會自己往上捲。點一下字幕可以暫停，再點一下繼續。想倒回去重講一句，用手指往下滑就好。\n\n速度太快或太慢，按右下角的加號、減號調整。\n\n準備好了就按紅色按鈕開始吧！';

  const s = {
    script: store.get('script', SAMPLE),
    fs: store.get('fs', 30), speed: store.get('speed', 5), ph: store.get('ph', 42), dim: store.get('dim', 60),
    center: store.get('center', false), flipText: store.get('flipText', false), countdown: store.get('countdown', true),
    mirror: store.get('mirror', true), hd: store.get('hd', true), facing: store.get('facing', 'user'),
  };

  // ---------- Prompter display ----------
  function applyStyle() {
    const r = document.documentElement.style;
    r.setProperty('--fs', s.fs + 'px');
    r.setProperty('--ph', s.ph + '%');
    r.setProperty('--dim', (s.dim / 100).toFixed(2));
    r.setProperty('--align', s.center ? 'center' : 'left');
    textEl.classList.toggle('flip', s.flipText);
    cam.classList.toggle('mirror', s.mirror && s.facing === 'user');
    $('speedVal').textContent = s.speed;
  }
  function renderText() { textEl.textContent = s.script.trim() ? s.script : '（還沒有講稿，按左下角的鉛筆圖示貼上講稿）'; }

  // ---------- Auto scroll ----------
  // speed 1..15 → px/sec scaled by font size so "5" feels similar at any size
  let running = false, last = 0, acc = 0, touching = false, resumeTimer = 0;
  const pxPerSec = () => s.speed * s.fs * 0.16; // speed 5 ≈ 5 Chinese chars/sec at default width
  function tick(t) {
    if (running && !touching) {
      const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
      acc += pxPerSec() * dt;
      if (acc >= 1) { const step = Math.floor(acc); acc -= step; scroller.scrollTop += step; }
      if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) setRunning(false);
    }
    last = t;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  function setRunning(on) {
    running = on; acc = 0;
    $('pausedTag').hidden = on || !(recording || scroller.scrollTop > 0);
  }
  function toggleRun() { setRunning(!running); }
  function setSpeed(v) { s.speed = Math.max(1, Math.min(15, v)); store.set('speed', s.speed); $('speed').value = s.speed; $('speedOut').textContent = s.speed; applyStyle(); }

  // Tap = pause/resume; drag = manual scroll then resume
  let startY = 0, moved = false;
  scroller.addEventListener('touchstart', (e) => { touching = true; moved = false; startY = e.touches[0].clientY; clearTimeout(resumeTimer); }, { passive: true });
  scroller.addEventListener('touchmove', (e) => { if (Math.abs(e.touches[0].clientY - startY) > 8) moved = true; }, { passive: true });
  scroller.addEventListener('touchend', (e) => {
    if (!moved) { e.preventDefault(); touching = false; toggleRun(); return; } // preventDefault stops the follow-up click
    resumeTimer = setTimeout(() => { touching = false; last = 0; }, 350);
  });
  scroller.addEventListener('click', toggleRun); // mouse only; taps are handled above

  // ---------- Camera ----------
  let stream = null;
  async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    const msg = $('camMsg');
    if (!navigator.mediaDevices?.getUserMedia) {
      msg.hidden = false;
      msg.innerHTML = '這個瀏覽器不能開相機。<br>請確認網址是 <b>https://</b> 開頭，並用 Safari 或 Chrome 開啟。';
      return;
    }
    const size = s.hd ? { width: { ideal: 1920 }, height: { ideal: 1080 } } : { width: { ideal: 1280 }, height: { ideal: 720 } };
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: s.facing, frameRate: { ideal: 30 }, ...size },
        audio: { echoCancellation: true, noiseSuppression: true }
      });
      cam.srcObject = stream; msg.hidden = true;
      await cam.play().catch(() => {});
    } catch (err) {
      msg.hidden = false;
      msg.innerHTML = '';
      const p = document.createElement('div');
      p.innerHTML = '需要相機和麥克風的權限才能錄影。<br>如果剛才按了「不允許」，請到瀏覽器的網站設定裡重新允許。';
      const b = document.createElement('button'); b.textContent = '再試一次'; b.onclick = startCamera;
      p.appendChild(document.createElement('br')); p.appendChild(b); msg.appendChild(p);
    }
    applyStyle();
  }

  // ---------- Recording ----------
  let recorder = null, chunks = [], recording = false, recStart = 0, timer = 0, lastBlob = null, lastExt = 'mp4';
  function pickType() {
    const types = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    for (const t of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported?.(t)) return t;
    return '';
  }
  async function countdown() {
    if (!s.countdown) return;
    const c = $('count'); c.hidden = false;
    for (let i = 3; i > 0; i--) { c.textContent = i; await new Promise(r => setTimeout(r, 1000)); }
    c.hidden = true;
  }
  async function startRec() {
    if (!stream) { toast('相機還沒準備好'); return; }
    if (!window.MediaRecorder) { toast('這個瀏覽器不支援錄影'); return; }
    $('recBtn').disabled = true;
    scroller.scrollTop = 0; setRunning(false);
    await countdown();
    const type = pickType();
    try { recorder = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: s.hd ? 8_000_000 : 4_000_000 } : undefined); }
    catch { recorder = new MediaRecorder(stream); }
    lastExt = (recorder.mimeType || type).includes('mp4') ? 'mp4' : 'webm';
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = showResult;
    recorder.start(1000);
    recording = true; recStart = Date.now();
    $('recBtn').disabled = false; $('recBtn').classList.add('on'); $('recBtn').setAttribute('aria-label', '停止錄影');
    $('recTime').hidden = false; updateTime(); timer = setInterval(updateTime, 500);
    $('editBtn').disabled = $('flipBtn').disabled = true;
    setRunning(true);
    wakeLock();
  }
  function stopRec() {
    if (!recorder) return;
    recording = false; setRunning(false);
    clearInterval(timer); $('recTime').hidden = true;
    $('recBtn').classList.remove('on'); $('recBtn').setAttribute('aria-label', '開始錄影');
    $('editBtn').disabled = $('flipBtn').disabled = false;
    recorder.stop();
  }
  function updateTime() {
    const sec = Math.floor((Date.now() - recStart) / 1000);
    $('recTime').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }
  function fileName() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return `提詞錄影_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${lastExt}`;
  }
  let lastUrl = '';
  function showResult() {
    lastBlob = new Blob(chunks, { type: recorder.mimeType || (lastExt === 'mp4' ? 'video/mp4' : 'video/webm') });
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(lastBlob);
    $('playback').src = lastUrl;
    $('resultInfo').textContent = (lastBlob.size / 1048576).toFixed(1) + ' MB';
    $('result').hidden = false;
  }
  async function saveVideo() {
    if (!lastBlob) return;
    const name = fileName();
    const file = new File([lastBlob], name, { type: lastBlob.type });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = lastUrl; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已下載影片');
  }

  // ---------- Wake lock ----------
  let lock = null;
  async function wakeLock() { try { lock = await navigator.wakeLock?.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeLock(); if (!stream?.active) startCamera(); } });

  // ---------- UI wiring ----------
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }
  $('recBtn').onclick = () => recording ? stopRec() : startRec();
  $('slower').onclick = () => setSpeed(s.speed - 1);
  $('faster').onclick = () => setSpeed(s.speed + 1);
  $('flipBtn').onclick = () => { s.facing = s.facing === 'user' ? 'environment' : 'user'; store.set('facing', s.facing); startCamera(); };
  $('editBtn').onclick = () => { setRunning(false); $('settings').hidden = false; };
  $('settingsDone').onclick = () => { $('settings').hidden = true; renderText(); scroller.scrollTop = 0; };
  $('discardBtn').onclick = () => { $('result').hidden = true; $('playback').removeAttribute('src'); lastBlob = null; scroller.scrollTop = 0; setRunning(false); };
  $('saveBtn').onclick = saveVideo;

  const script = $('script');
  script.value = s.script;
  script.addEventListener('input', () => { s.script = script.value; store.set('script', s.script); });

  function bindRange(id, key, fmt) {
    const el = $(id), out = $(id + 'Out');
    el.value = s[key]; out.textContent = fmt(s[key]);
    el.addEventListener('input', () => { s[key] = +el.value; store.set(key, s[key]); out.textContent = fmt(s[key]); applyStyle(); });
  }
  bindRange('fs', 'fs', v => v + 'px');
  bindRange('speed', 'speed', v => v);
  bindRange('ph', 'ph', v => v + '%');
  bindRange('dim', 'dim', v => v + '%');

  function bindToggle(id, key, after) {
    const el = $(id); el.setAttribute('aria-pressed', s[key]);
    el.onclick = () => { s[key] = !s[key]; store.set(key, s[key]); el.setAttribute('aria-pressed', s[key]); applyStyle(); after && after(); };
  }
  bindToggle('tCenter', 'center');
  bindToggle('tFlipText', 'flipText');
  bindToggle('tCountdown', 'countdown');
  bindToggle('tMirror', 'mirror');
  bindToggle('tHD', 'hd', startCamera);

  // Keyboard / Bluetooth remote
  document.addEventListener('keydown', (e) => {
    if (e.target === script) return;
    const nudge = s.fs * 1.5 * 2;
    switch (e.key) {
      case ' ': case 'Enter': e.preventDefault(); toggleRun(); break;
      case 'ArrowUp': e.preventDefault(); setSpeed(s.speed + 1); break;
      case 'ArrowDown': e.preventDefault(); setSpeed(s.speed - 1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); scroller.scrollTop -= nudge; break;
      case 'ArrowRight': case 'PageDown': e.preventDefault(); scroller.scrollTop += nudge; break;
      case 'r': case 'R': recording ? stopRec() : startRec(); break;
    }
  });

  renderText(); applyStyle(); startCamera();
})();
</script>
</body>
</html>
